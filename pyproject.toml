[project]
name = "hesteron_nav_sync"
authors = [
    { name = "Hesteron Kft." }
]
description = "Pulls inbound (purchase) invoices reported to NAV Online Számla and stages them as draft Purchase Invoices in ERPNext."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "requests",
    "pypdf",
    "pycryptodome"
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"
